
name: Build JEE Rush OS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          for file in package.json index.html app.js one-shots.json capacitor.config.json; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

      - name: Remove version from browser title
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          updated, count = re.subn(
              r"<title>.*?</title>",
              "<title>JEE Rush OS</title>",
              html,
              count=1,
              flags=re.IGNORECASE | re.DOTALL,
          )

          if count != 1:
              raise SystemExit("Could not find the HTML title in index.html")

          path.write_text(updated, encoding="utf-8")
          print("Browser title set to JEE Rush OS.")
          PY

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund \
            @capacitor/core@^8 \
            @capacitor/cli@^8 \
            @capacitor/android@^8

      - name: Prepare web assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          cp index.html app.js one-shots.json www/
          test -s www/index.html
          test -s www/app.js
          test -s www/one-shots.json

      - name: Validate Capacitor configuration
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('capacitor.config.json','utf8'))"

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Rush-OS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
