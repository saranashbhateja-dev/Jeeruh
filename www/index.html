<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020">
<title>JEE Rush OS </title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2c;--panel2:#172238;--line:#26344d;--text:#edf3ff;--muted:#93a3bd;--accent:#77a7ff;--green:#45d6a2;--orange:#ffbf69;--red:#ff7b87;--shadow:0 16px 40px #0002}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 5% -15%,#1b3260 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1240px;margin:auto;padding:22px 22px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#9cc0ff,#507ff2);color:#071226;font-size:22px;font-weight:950;box-shadow:0 8px 28px #4f7ff344}.brand h1{font-size:20px;letter-spacing:-.6px;margin:0}.brand p{margin:1px 0 0;color:var(--muted);font-size:11px;letter-spacing:2px;font-weight:800}.clock{text-align:right}.time{font:800 24px/1.1 ui-monospace,monospace;letter-spacing:.5px}.date{color:var(--muted);font-size:12px;margin-top:5px}.nav{display:flex;gap:6px;overflow:auto;padding:6px;background:#111a2cdd;border:1px solid var(--line);border-radius:16px;margin-bottom:18px;position:sticky;top:8px;z-index:5;backdrop-filter:blur(16px)}.nav button{flex:1;min-width:max-content;border:0;background:transparent;color:var(--muted);border-radius:11px;padding:11px 14px;font-weight:750}.nav button.active{background:var(--accent);color:#071326}.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.panel,.stat{background:linear-gradient(145deg,#151f34,#11192a);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel{padding:20px;margin-bottom:16px}.hero-main{padding:28px;background:linear-gradient(130deg,#1a2e52,#131d31 70%);min-height:210px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--accent);font-weight:900;text-transform:uppercase}.hero h2{font-size:clamp(26px,4vw,42px);letter-spacing:-1.6px;line-height:1.08;margin:10px 0}.hero p{color:var(--muted);max-width:500px;margin:0}.hero-side{display:flex;flex-direction:column;justify-content:space-between}.progressnum{font-size:42px;font-weight:900;letter-spacing:-2px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.stat{padding:16px}.stat small{display:block;color:var(--muted);font-weight:800;font-size:10px;letter-spacing:1px;text-transform:uppercase}.stat strong{display:block;font-size:28px;letter-spacing:-1px;margin-top:4px}.stat span{font-size:12px;color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.sectionhead h2{font-size:19px;letter-spacing:-.5px;margin:0}.btn{border:1px solid transparent;border-radius:11px;padding:10px 14px;background:var(--accent);color:#081428;font-weight:850}.btn.secondary{background:var(--panel2);color:var(--text);border-color:var(--line)}.btn.danger{background:#3a1e2b;color:#ffb5bd;border-color:#6b2b3d}.btn.small{padding:7px 10px;font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.field{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:11px;min-width:0}.search{flex:1;min-width:180px}.chapter-list{display:grid;gap:10px}.chapter{border:1px solid var(--line);border-radius:16px;background:#111a2a;overflow:hidden}.chapter.done{border-color:#286f60}.chapter-head{display:flex;align-items:center;gap:12px;padding:14px}.num{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:900}.chapter.done .num{background:#143b35;color:var(--green);border-color:#286f60}.chapter-title{font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}.status{font-size:10px;white-space:nowrap;font-weight:900;letter-spacing:.5px;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--muted)}.status.complete{color:var(--green);border-color:#286f60;background:#12342e}.tasks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 14px 14px}.task{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#172238;border-radius:12px;padding:12px;min-width:0;font-size:12px;font-weight:700;cursor:pointer}.task input{accent-color:var(--green);width:19px;height:19px;flex:none}.task span{min-width:0}.chapter-meta{display:flex;gap:12px;flex-wrap:wrap;padding:0 14px 13px;color:var(--muted);font-size:11px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.due-list{display:grid;gap:8px}.due{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#111a2a;padding:13px;border-radius:14px}.due-body{flex:1;min-width:0}.due-title{font-weight:800;overflow-wrap:anywhere}.due-sub{color:var(--muted);font-size:12px;margin-top:3px}.due-date{font-size:11px;font-weight:800;color:var(--orange)}.due input{width:20px;height:20px;accent-color:var(--green)}.subject-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.subject-tabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 13px;border-radius:99px;font-weight:800}.subject-tabs button.active{background:var(--accent);color:#071326;border-color:var(--accent)}.subject-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.subject-row:last-child{border:0}.subject-name{font-weight:800;flex:1}.bar{height:7px;border-radius:99px;background:#26334b;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#6f9dff,#49d6a3);border-radius:99px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cal-label{text-align:center;color:var(--muted);font-size:11px;font-weight:800;padding:5px}.cal-day{min-height:75px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px;min-width:0}.cal-day.today{outline:2px solid var(--accent)}.cal-day .day{font-size:12px;font-weight:900}.cal-day small{display:block;font-size:9px;color:var(--orange);margin-top:5px;overflow-wrap:anywhere}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.setting{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel)}.setting h3{margin:0 0 5px;font-size:14px}.setting p{margin:0 0 10px;color:var(--muted);font-size:12px}.cloud-setting{margin:14px 0 16px;border-color:#35527b;background:linear-gradient(145deg,#15243b,#111a2a)}.cloud-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.cloud-top h3{font-size:15px}.cloud-top p{overflow-wrap:anywhere}.cloud-dot{width:11px;height:11px;flex:none;border-radius:50%;background:var(--orange);box-shadow:0 0 0 5px #ffbf6918}.cloud-dot.online{background:var(--green);box-shadow:0 0 0 5px #45d6a218}.cloud-auth-fields{display:grid;gap:8px;max-width:520px}.cloud-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.cloud-help,.auth-msg{font-size:11px;color:var(--muted);margin:12px 0 0;overflow-wrap:anywhere}.auth-msg{min-height:16px;margin-top:0}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#e5efff;color:#081326;border-radius:12px;padding:11px 16px;font-weight:800;box-shadow:var(--shadow);z-index:20;display:none}.toast.show{display:block}.footer{text-align:center;color:var(--muted);font-size:11px;padding:12px}
.navshort{display:none}@media(max-width:760px){.navlong{display:none}.navshort{display:inline}.app{padding:14px 12px calc(90px + env(safe-area-inset-bottom))}.top{align-items:flex-start}.clock .time{font-size:20px}.hero{grid-template-columns:1fr}.hero-main{min-height:auto;padding:22px}.hero-side{gap:10px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat strong{font-size:25px}.panel{padding:15px;border-radius:17px}.nav{position:fixed;top:auto;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;margin:0;border-radius:17px;box-shadow:0 10px 35px #0008;background:#111a2cf2;justify-content:space-around}.nav button{padding:10px 9px;font-size:12px;min-width:auto}.nav button .navlong{display:none}.tasks{grid-template-columns:1fr;gap:7px}.task{padding:12px;font-size:13px}.chapter-head{padding:12px;gap:9px}.chapter-meta{padding:0 12px 12px}.status{font-size:9px;padding:4px 7px}.num{width:32px;height:32px}.calendar{gap:3px}.cal-day{min-height:57px;padding:4px;border-radius:7px}.cal-day small{font-size:8px}.settings-grid{grid-template-columns:1fr}.sectionhead h2{font-size:17px}}
@media(max-width:390px){.brand h1{font-size:17px}.brand p{font-size:9px}.logo{width:42px;height:42px}.time{font-size:18px}.date{font-size:10px}.chapter-title{font-size:13px}.status{max-width:78px;overflow:hidden;text-overflow:ellipsis}.nav button{padding:10px 7px}.nav button span{font-size:10px}}
</style></head>
